[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-helper"
version = "0.2.0"
description = "Academia screenshot helper and Question Runner for Linux Hyprland"
requires-python = ">=3.11"
dependencies = ["Pillow>=11; sys_platform == 'win32'"]

[project.optional-dependencies]
build = ["pyinstaller>=6.16,<7"]

[project.scripts]
academic = "academia.cli:main"

[tool.setuptools]
packages = ["academia"]

[tool.ruff]
line-length = 100
