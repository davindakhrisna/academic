[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-helper"
version = "0.1.0"
description = "Academic screenshot helper with a guarded Question Runner"
requires-python = ">=3.11"
dependencies = ["Pillow>=11; sys_platform == 'win32'"]

[project.optional-dependencies]
build = ["pyinstaller>=6.16,<7"]

[project.scripts]
academic = "main.cli:main"

[tool.setuptools]
packages = ["main"]

[tool.ruff]
line-length = 100
